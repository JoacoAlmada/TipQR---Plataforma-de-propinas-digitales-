services:

  postgres:
    image: postgres:16-alpine
    container_name: tipqr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tipqr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - tipqr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tipqr"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tipqr-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tipqr.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - tipqr_pgadmin_data:/var/lib/pgadmin

volumes:
  tipqr_postgres_data:
  tipqr_pgadmin_data:
