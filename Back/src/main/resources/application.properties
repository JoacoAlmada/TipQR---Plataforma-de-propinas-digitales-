spring.application.name=tipqr-backend

# ── Servidor ─────────────────────────────────────────────────────────────────
server.port=8080

# ── Base de datos ─────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tipqr}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:clave-secreta-tipqr-2026-muy-larga-para-hs256}
jwt.expiration=86400000

# ── Swagger / OpenAPI ─────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ── Email (SMTP) — valores reales en Back/.env (gitignored) ───────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@tipqr.com}

# ── Google reCAPTCHA v2 — valores reales en Back/.env ─────────────────────────
recaptcha.site-key=${RECAPTCHA_SITE_KEY:}
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}
recaptcha.enabled=${RECAPTCHA_ENABLED:true}

# ── URLs ──────────────────────────────────────────────────────────────────────
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}
app.backend-url=${APP_BACKEND_URL:http://localhost:8080}

# ── Tamaño máximo de adjuntos (documentos del registro) ───────────────────────
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB
