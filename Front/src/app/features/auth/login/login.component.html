<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-50 to-indigo-100">
  <div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-lg">

    <!-- Logo -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-indigo-900">TipQR</h1>
      <p class="text-gray-400 text-sm mt-1">Plataforma de propinas digitales</p>
    </div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <!-- Email -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" formControlName="email"
          class="w-full px-3 py-2 border rounded-lg text-sm outline-none transition-colors
                 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500
                 border-gray-300"
          placeholder="tu@email.com" />
        @if (f['email'].invalid && f['email'].touched) {
          <p class="text-red-500 text-xs mt-1">Ingresá un email válido</p>
        }
      </div>

      <!-- Contraseña -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
        <input type="password" formControlName="password"
          class="w-full px-3 py-2 border rounded-lg text-sm outline-none transition-colors
                 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500
                 border-gray-300"
          placeholder="••••••••" />
        @if (f['password'].invalid && f['password'].touched) {
          <p class="text-red-500 text-xs mt-1">La contraseña es requerida</p>
        }
      </div>

      <!-- Error de credenciales -->
      @if (errorMsg) {
        <div class="mb-4 px-3 py-2 bg-red-50 border border-red-200 rounded-lg">
          <p class="text-red-600 text-sm">{{ errorMsg }}</p>
        </div>
      }

      <!-- Submit -->
      <button type="submit" [disabled]="form.invalid || loading"
        class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700
               disabled:bg-indigo-300 disabled:cursor-not-allowed
               text-white font-medium rounded-lg transition-colors text-sm">
        @if (loading) { Ingresando... } @else { Ingresar }
      </button>

    </form>
  </div>
</div>
