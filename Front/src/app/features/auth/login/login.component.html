<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-canvas via-white to-primary/5 p-4">
  <div class="w-full max-w-md p-8 card">

    <!-- Logo -->
    <div class="text-center mb-8">
      <a routerLink="/" class="inline-flex items-center gap-2">
        <span class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-primary text-white font-bold text-sm">Tip</span>
        <span class="text-2xl font-bold text-primary-active">TipQR</span>
      </a>
      <p class="text-muted text-sm mt-2">Plataforma de propinas digitales</p>
    </div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <!-- Email -->
      <div class="mb-4">
        <label class="label">Email</label>
        <input type="email" formControlName="email"
          class="input"
          [class.input-error]="f['email'].invalid && f['email'].touched"
          placeholder="tu@email.com" />
        @if (f['email'].invalid && f['email'].touched) {
          <p class="field-error">Ingresá un email válido</p>
        }
      </div>

      <!-- Contraseña -->
      <div class="mb-6">
        <label class="label">Contraseña</label>
        <input type="password" formControlName="password"
          class="input"
          [class.input-error]="f['password'].invalid && f['password'].touched"
          placeholder="••••••••" />
        @if (f['password'].invalid && f['password'].touched) {
          <p class="field-error">La contraseña es requerida</p>
        }
      </div>

      <!-- Error de credenciales -->
      @if (errorMsg) {
        <div class="mb-4 alert-error">{{ errorMsg }}</div>
      }

      <!-- Submit -->
      <button type="submit" [disabled]="form.invalid || loading" class="btn btn-primary w-full">
        @if (loading) { Ingresando... } @else { Ingresar }
      </button>

    </form>

    <div class="text-center mt-6">
      <a routerLink="/" class="text-sm text-muted hover:text-primary transition-colors">← Volver al inicio</a>
    </div>
  </div>
</div>
