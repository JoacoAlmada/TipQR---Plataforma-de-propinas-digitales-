<div class="min-h-screen flex items-center justify-center bg-canvas p-4">
  <div class="w-full max-w-md p-10 card text-center">
    <a routerLink="/" class="inline-flex items-center gap-2 mb-8">
      <span class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-primary text-[#fdfaf4] font-display font-semibold">T</span>
      <span class="font-display text-2xl font-semibold text-primary">TipQR</span>
    </a>

    @if (ok()) {
      <div class="mx-auto w-16 h-16 rounded-full bg-success-soft text-[#3a5f3c] flex items-center justify-center text-3xl">✓</div>
      <h1 class="mt-6 font-display text-2xl font-semibold text-ink">¡Email verificado!</h1>
      <p class="mt-3 text-muted leading-relaxed">
        Tu email quedó confirmado. Volvé a la pestaña donde estabas registrándote
        para continuar con los datos de tu comercio.
      </p>
    } @else {
      <div class="mx-auto w-16 h-16 rounded-full bg-error-soft text-error flex items-center justify-center text-3xl">✕</div>
      <h1 class="mt-6 font-display text-2xl font-semibold text-ink">Link inválido</h1>
      <p class="mt-3 text-muted leading-relaxed">
        El link de verificación no es válido o ya fue usado. Probá registrarte de nuevo.
      </p>
      <a routerLink="/registro" class="btn btn-primary mt-7">Volver al registro</a>
    }
  </div>
</div>
