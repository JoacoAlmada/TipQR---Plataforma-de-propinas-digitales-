<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-surface-soft via-canvas to-primary/5 p-4">
  <div class="w-full max-w-md p-8 card text-center">
    <a routerLink="/" class="inline-flex items-center gap-2 mb-6">
      <span class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-primary text-white font-bold text-sm">Tip</span>
      <span class="text-2xl font-bold text-primary-active">TipQR</span>
    </a>

    @if (ok()) {
      <div class="mx-auto w-16 h-16 rounded-full bg-success-soft text-green-600 flex items-center justify-center text-3xl">✓</div>
      <h1 class="mt-5 text-xl font-bold text-ink">¡Email verificado!</h1>
      <p class="mt-3 text-muted">
        Tu email quedó confirmado. Volvé a la pestaña donde estabas registrándote
        para continuar con los datos de tu comercio.
      </p>
    } @else {
      <div class="mx-auto w-16 h-16 rounded-full bg-error-soft text-error flex items-center justify-center text-3xl">✕</div>
      <h1 class="mt-5 text-xl font-bold text-ink">Link inválido</h1>
      <p class="mt-3 text-muted">
        El link de verificación no es válido o ya fue usado. Probá registrarte de nuevo.
      </p>
      <a routerLink="/registro" class="btn btn-primary mt-6">Volver al registro</a>
    }
  </div>
</div>
