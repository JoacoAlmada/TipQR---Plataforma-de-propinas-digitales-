<div class="min-h-screen app-bg">
  <!-- Top bar -->
  <header class="surface-dark text-white">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-primary text-[#fdfaf4] font-display font-semibold text-sm">T</span>
        <span class="font-display text-xl font-semibold tracking-tight">TipQR</span>
        <span class="ml-2 text-[11px] font-semibold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-accent/20 text-accent">Superadmin</span>
      </div>
      <div class="flex items-center gap-4">
        <span class="text-sm text-white/75 hidden sm:inline">{{ usuario?.nombre }} {{ usuario?.apellido }}</span>
        <button (click)="logout()" class="text-sm text-white/60 hover:text-white transition-colors">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <!-- Sub-navegación -->
  <nav class="border-b border-hairline bg-white/40">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 flex gap-1">
      <a routerLink="/superadmin/solicitudes" routerLinkActive="border-primary text-primary"
        [routerLinkActiveOptions]="{ exact: false }"
        class="px-4 py-3 text-sm font-medium border-b-2 border-transparent text-muted hover:text-ink transition-colors">
        Cuentas nuevas
      </a>
      <a routerLink="/superadmin/empresas" routerLinkActive="border-primary text-primary"
        class="px-4 py-3 text-sm font-medium border-b-2 border-transparent text-muted hover:text-ink transition-colors">
        Empresas nuevas
      </a>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-10">
    <router-outlet />
  </main>
</div>
