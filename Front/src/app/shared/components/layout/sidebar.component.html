<aside class="w-64 bg-indigo-900 text-white flex flex-col h-full shrink-0">

  <!-- Logo -->
  <div class="p-6 border-b border-indigo-700">
    <h1 class="text-xl font-bold tracking-tight">TipQR</h1>
    <p class="text-sm text-indigo-300 mt-1">
      {{ usuario?.nombre }} {{ usuario?.apellido }}
    </p>
    <span class="inline-block mt-2 text-xs bg-indigo-700 px-2 py-0.5 rounded-full">
      {{ usuario?.rol }}
    </span>
  </div>

  <!-- Navegación -->
  <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
    <a routerLink="/dashboard"
       routerLinkActive="bg-indigo-700 font-semibold"
       class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm hover:bg-indigo-700 transition-colors">
      Dashboard
    </a>

    @if (esAdmin) {
      <a routerLink="/empresas"
         routerLinkActive="bg-indigo-700 font-semibold"
         class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm hover:bg-indigo-700 transition-colors">
        Empresas
      </a>
    }
  </nav>

  <!-- Cerrar sesión -->
  <div class="p-4 border-t border-indigo-700">
    <button (click)="logout()"
      class="w-full text-left text-sm text-indigo-300 hover:text-white px-3 py-2 rounded-lg hover:bg-indigo-700 transition-colors">
      Cerrar sesión
    </button>
  </div>

</aside>
