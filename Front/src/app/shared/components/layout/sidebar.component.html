<aside class="w-64 bg-sidebar text-white flex flex-col h-full shrink-0">

  <!-- Logo -->
  <div class="p-6 border-b border-white/10">
    <div class="flex items-center gap-2">
      <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-white/15 font-bold text-sm">Tip</span>
      <h1 class="text-xl font-bold tracking-tight">TipQR</h1>
    </div>
    <p class="text-sm text-white/70 mt-3">
      {{ usuario?.nombre }} {{ usuario?.apellido }}
    </p>
    <span class="inline-block mt-2 text-xs bg-white/10 px-2 py-0.5 rounded-full text-white/90">
      {{ usuario?.rol }}
    </span>
  </div>

  <!-- Navegación -->
  <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
    <a [routerLink]="inicio"
       routerLinkActive="bg-white/15 font-semibold"
       class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-white/90 hover:bg-white/10 transition-colors">
      <span class="text-base">🏠</span> Inicio
    </a>

    @if (esAdmin) {
      <a routerLink="/app/empresa"
         routerLinkActive="bg-white/15 font-semibold"
         class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-white/90 hover:bg-white/10 transition-colors">
        <span class="text-base">🏢</span> Mi empresa
      </a>
    }
  </nav>

  <!-- Cerrar sesión -->
  <div class="p-4 border-t border-white/10">
    <button (click)="logout()"
      class="w-full text-left text-sm text-white/70 hover:text-white px-3 py-2 rounded-lg hover:bg-white/10 transition-colors">
      Cerrar sesión
    </button>
  </div>

</aside>
